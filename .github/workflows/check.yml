name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
        with:
          extra-conf: lazy-trees = false
      - name: Evaluate all host configurations
        run: bash scripts/ci-checks.sh eval

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
        with:
          extra-conf: lazy-trees = false
      - name: Standards gates (flake checks — format / placement / dendritic / dangling)
        run: bash scripts/ci-checks.sh gates
      - name: Secret scan (gitleaks)
        # Backstop for the pre-commit gitleaks hook (the gates above exclude
        # pre-commit). Git mode → respects .gitignore, so repos/ is never scanned.
        run: nix run --inputs-from . nixpkgs#gitleaks -- detect --redact --no-banner --config .gitleaks.toml --source .
